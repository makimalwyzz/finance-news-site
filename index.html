            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            padding: 32px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .update-time {
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Stats Section */
        .stats-section {
            padding: 24px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.15); }
        .stat-icon.pink { background: rgba(236, 72, 153, 0.15); }
        .stat-icon.cyan { background: rgba(6, 182, 212, 0.15); }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .tabs-section {
            padding: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .region-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);

            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;

            background: var(--gradient-primary);
            color: white;
        }

            background: rgba(255, 255, 255, 0.05);

            gap: 8px;
            flex: 1;

            font-weight: 500;

            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .source-tab:hover:not(.active) {
            border-color: var(--text-muted);
        }

            padding: 24px 0 48px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));

            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;

            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);

        .news-card:hover::before {

        }

            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;

        }

            color: var(--text-secondary);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .read-more:hover {
            background: var(--accent-blue);
            color: white;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);

        }

            margin-top: 20px;
            color: var(--text-secondary);

        }

        /* Responsive */

                grid-template-columns: 1fr;
            }

                grid-template-columns: repeat(2, 1fr);
            }
        }

          "description": "文｜胡香赟\n  编辑｜海若镜\n  36氪获悉，精神心理数字诊疗平台「望里科技」已完成数千万元B+轮融资。本轮融资由远毅资本独家投资，募集资金主要用于产品研发。此外，望里科技的新一轮融资也已开启，指数资本任财务顾问。\n  望里科技专注于精神心理领域，自建的该领域数据库已积累30万真实世界患者数据。此外，望里科技已在精神病学国际权威期刊发表十多篇论文，并承接多项国家级、省部级科研课题；在应用方面，公司可针对不同行业客户提供“专业设备+APP+专业人员”的完整解决方案，其一站式心理服务方案已覆盖全国16个省100+城市。\n  望里科技创始人、CEO李岱介绍，基于对大量高质量多模态数据的持续积累，以及精神科、神经科等多学科临床专家、医师、心理治疗师、咨询师专业微调的语料，望里科技打造了融合CBT/ACT/PPT/CBM等多维度心理疗法与认知训练范式的全节点知识图谱与WonderLab大模型。以此为专业知识基座，望里科技深入融合强化学习（RL）与动态干预（JITAI）等优化理论，构建了独特的治疗优化算法。\n  具体而言，通过“宏观-中观-微观”三级推荐引擎，该算法系统能够实时感知用户的状态变化并",

    <script>
        let newsData = null;
        let currentRegion = 'all';
        let currentSource = 'all';

        async function loadNewsData() {
            // 优先使用内嵌数据
            if (window.embeddedNewsData) {
                newsData = window.embeddedNewsData;
                updateUI();
                return;
            }
            // 尝试从外部 JSON 文件加载
            try {
                const response = await fetch('news_data.json');
                if (response.ok) {
                    newsData = await response.json();
                    updateUI();
                    return;
                }
            } catch (e) {
                console.log('Local data not found, loading demo data...');
            }
            loadDemoData();
        }

                        ]

                            { title: '新能源汽车销量再创新高 产业链迎来机遇', description: '最新数据显示国内新能源汽车渗透率突破40%，相关产业链公司股价上涨。', link: 'https://www.eastmoney.com', pubDate: new Date(Date.now() - 9000000).toISOString() }
                        ]
                    }
                ]
            };
            updateUI();
        }

        function switchRegion(region) {
            currentRegion = region;
            currentSource = 'all';
            
            document.querySelectorAll('.region-tab').forEach(tab => {
                const isActive = tab.dataset.region === region;
                tab.classList.toggle('active', isActive);
            });

            updateSourceTabs();
            renderNews();
        }

        function updateUI() {
            if (!newsData) return;

            // 统计数据
            let totalNews = 0;
            let intSources = 0, cnSources = 0;
            let intNews = 0, cnNews = 0;
            
            newsData.sources.forEach(source => {
                const count = source.items ? source.items.length : 0;
                totalNews += count;
                if (source.region === 'chinese') { cnSources++; cnNews += count; }
                else { intSources++; intNews += count; }
            });

            document.getElementById('total-news').textContent = totalNews;
            document.getElementById('int-sources').textContent = intSources;
            document.getElementById('cn-sources').textContent = cnSources;
            document.getElementById('count-all').textContent = totalNews;
            document.getElementById('count-international').textContent = intNews;
            document.getElementById('count-chinese').textContent = cnNews;

            // 更新时间
            if (newsData.fetchTime) {
                const date = new Date(newsData.fetchTime);
                document.getElementById('update-time').textContent = 
                    `更新于 ${date.toLocaleDateString('zh-CN')} ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
            }

            updateSourceTabs();
            renderNews();

            // 隐藏加载动画
            document.getElementById('loading').classList.add('hidden');
        }

        function updateSourceTabs() {
            const container = document.getElementById('source-tabs');
            container.innerHTML = '';

            const sources = newsData.sources.filter(s => 
                currentRegion === 'all' || s.region === currentRegion
            );

            const allTab = document.createElement('button');
            allTab.className = 'source-tab' + (currentSource === 'all' ? ' active' : '');
            allTab.textContent = '全部来源';
            allTab.onclick = () => {
                currentSource = 'all';
                updateSourceTabs();
                renderNews();
            };
            container.appendChild(allTab);

            sources.forEach(source => {
                const tab = document.createElement('button');
                tab.className = 'source-tab' + (currentSource === source.name ? ' active' : '');
                tab.textContent = source.name;
                tab.onclick = () => {
                    currentSource = source.name;
                    updateSourceTabs();
                    renderNews();
                };
                container.appendChild(tab);
            });
        }

        function renderNews() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            let allItems = [];

            newsData.sources.forEach(source => {
                if (currentRegion !== 'all' && source.region !== currentRegion) return;
                if (currentSource !== 'all' && source.name !== currentSource) return;

                if (source.items) {
                    source.items.forEach(item => {
                        allItems.push({ ...item, sourceName: source.name, sourceRegion: source.region });
                    });
                }
            });

            // 按时间排序
            allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

            if (allItems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无新闻数据</p>
                    </div>
                `;
                return;
            }

            allItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';

                const timeStr = item.pubDate ? formatTime(item.pubDate) : '';

                card.innerHTML = `
                    <div class="news-header">
                        <span class="news-source">${item.sourceName}</span>
                        <span class="news-time">${timeStr}</span>
                    </div>
                    <h3 class="news-title">
                        <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                    </h3>
                    ${item.description ? `<p class="news-description">${item.description}</p>` : ''}
                    <div class="news-footer">
                        <a href="${item.link}" target="_blank" rel="noopener" class="read-more">
                            阅读全文 →
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function formatTime(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diff = now - date;

                if (diff < 3600000) {
                    return `${Math.floor(diff / 60000)}分钟前`;
                } else if (diff < 86400000) {
                    return `${Math.floor(diff / 3600000)}小时前`;
                } else {
                    return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                }
            } catch {
                return dateStr;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', loadNewsData);
    </script>
