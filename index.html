            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            padding: 32px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .update-time {
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Stats Section */
        .stats-section {
            padding: 24px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.15); }
        .stat-icon.pink { background: rgba(236, 72, 153, 0.15); }
        .stat-icon.cyan { background: rgba(6, 182, 212, 0.15); }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .tabs-section {
            padding: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .region-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);

        .region-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            background: var(--gradient-primary);
            color: white;
        }

            background: rgba(255, 255, 255, 0.05);
        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;

            padding: 8px 16px;
            border: 1px solid var(--border-color);

            border-radius: 20px;

            font-weight: 500;

            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .source-tab:hover:not(.active) {
            border-color: var(--text-muted);
        }

            padding: 24px 0 48px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;

            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;

            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .news-card:hover::before {
            opacity: 1;
        }

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;

            gap: 6px;

            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);

            font-size: 12px;

        }

            color: var(--text-secondary);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

            justify-content: flex-end;

            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .read-more:hover {
            background: var(--accent-blue);
            color: white;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;

            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);

        }

        .loading-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Responsive */

            }

                grid-template-columns: 1fr;
            }

                grid-template-columns: repeat(2, 1fr);
            }
        }

          "description": "智能家居发展十余年，各类智能单品早已走进千家万户，但一个困局却始终未能突破：单品“智能化”多流于表面，且彼此孤立，难以串联成一个真正懂生活、主动服务人真实需求的“智能之家”。\n  比如用于交流的语音助手，虽能随叫随应，但也会成为某一刻的噪音；又如守护安全的摄像头，并不能感知被褥之下人体的真实状态；即便是可掌控全屋智能的手机，却也不是24小时被人贴身操控。\n  “全域协同”、“主动服务”、“无感存在”至今仍是智能家居难以破解的重要问题。\n  而今，作为硬件智能家居的年度风向标，AWE2026将AI融合下的科技，投向硬件智能与家居场景的深度适配，破解“智能不智”的痛点。\n  所以可以看到，在这个新科技元素全覆盖的展会上，一幅想象中的未来家居生态图景正在徐徐展开：可整理散落杂物的管家机器人、懂情绪的智能玩偶、能主动管理健康的智能床……\n  这其中，睡眠赛道无疑是这场未来智能家居生态展览上的焦点，赛道引领者思最具看点。它不仅是家居行业唯一以“双展位”形式登陆AWE2026的企业，更携手华为鸿蒙，以“鸿蒙智选 慕思智能床Pro H-DESIGN”新品，将智能睡眠体验拉到科技界聚光灯的中心。余承东",

    <script>
        let newsData = null;
        let currentRegion = 'all';
        let currentSource = 'all';

        async function loadNewsData() {
            // 优先使用内嵌数据
            if (window.embeddedNewsData) {
                newsData = window.embeddedNewsData;
                updateUI();
                return;
            }
            // 尝试从外部 JSON 文件加载
            try {
                const response = await fetch('news_data.json');
                if (response.ok) {
                    newsData = await response.json();
                    updateUI();
                    return;
                }
            } catch (e) {
                console.log('Local data not found, loading demo data...');
            }
            loadDemoData();
        }

        function loadDemoData() {
            newsData = {
                fetchTime: new Date().toISOString(),
                sources: [
                    {
                        name: 'Reuters Business', category: 'Business', region: 'international',

                        items: [

                            { title: 'Oil Prices Surge on Middle East Supply Concerns', description: 'Brent crude jumps 3% as geopolitical tensions raise concerns about potential supply disruptions.', link: 'https://reuters.com/business', pubDate: new Date(Date.now() - 7200000).toISOString() },

                        ]
                    },
                    {
                        name: '新浪财经', category: '综合', region: 'chinese',
                        itemCount: 3,
                        items: [
                            { title: '人民币汇率稳中有升 央行释放积极信号', description: '中国人民银行表示将保持人民币汇率在合理均衡水平上的基本稳定，增强市场信心。', link: 'https://finance.sina.com.cn', pubDate: new Date(Date.now() - 3600000).toISOString() },

                            { title: '多家银行下调存款利率 理财市场或迎调整', description: '国有大行纷纷下调存款利率，分析师预计将对银行理财产品收益率产生影响。', link: 'https://finance.sina.com.cn', pubDate: new Date(Date.now() - 10800000).toISOString() }
                        ]
                    },
                    {
                        name: '东方财富', category: '快讯', region: 'chinese',
                        itemCount: 2,
                        items: [
                            { title: '北向资金今日净买入超50亿元 连续三日流入', description: '外资持续看好中国市场，北向资金大幅流入A股市场，偏好金融和消费板块。', link: 'https://www.eastmoney.com', pubDate: new Date(Date.now() - 5400000).toISOString() },
                            { title: '新能源汽车销量再创新高 产业链迎来机遇', description: '最新数据显示国内新能源汽车渗透率突破40%，相关产业链公司股价上涨。', link: 'https://www.eastmoney.com', pubDate: new Date(Date.now() - 9000000).toISOString() }
                        ]
                    }
                ]
            };
            updateUI();
        }

        function switchRegion(region) {
            currentRegion = region;
            currentSource = 'all';
            
            document.querySelectorAll('.region-tab').forEach(tab => {
                const isActive = tab.dataset.region === region;
                tab.classList.toggle('active', isActive);
            });

            updateSourceTabs();
            renderNews();
        }

        function updateUI() {
            if (!newsData) return;

            // 统计数据
            let totalNews = 0;
            let intSources = 0, cnSources = 0;
            let intNews = 0, cnNews = 0;
            
            newsData.sources.forEach(source => {
                const count = source.items ? source.items.length : 0;
                totalNews += count;
                if (source.region === 'chinese') { cnSources++; cnNews += count; }
                else { intSources++; intNews += count; }
            });

            document.getElementById('total-news').textContent = totalNews;
            document.getElementById('int-sources').textContent = intSources;
            document.getElementById('cn-sources').textContent = cnSources;
            document.getElementById('count-all').textContent = totalNews;
            document.getElementById('count-international').textContent = intNews;
            document.getElementById('count-chinese').textContent = cnNews;

            // 更新时间
            if (newsData.fetchTime) {
                const date = new Date(newsData.fetchTime);
                document.getElementById('update-time').textContent = 
                    `更新于 ${date.toLocaleDateString('zh-CN')} ${date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
            }

            updateSourceTabs();
            renderNews();

            // 隐藏加载动画
            document.getElementById('loading').classList.add('hidden');
        }

        function updateSourceTabs() {
            const container = document.getElementById('source-tabs');
            container.innerHTML = '';

            const sources = newsData.sources.filter(s => 
                currentRegion === 'all' || s.region === currentRegion
            );

            const allTab = document.createElement('button');
            allTab.className = 'source-tab' + (currentSource === 'all' ? ' active' : '');
            allTab.textContent = '全部来源';
            allTab.onclick = () => {
                currentSource = 'all';
                updateSourceTabs();
                renderNews();
            };
            container.appendChild(allTab);

            sources.forEach(source => {
                const tab = document.createElement('button');
                tab.className = 'source-tab' + (currentSource === source.name ? ' active' : '');
                tab.textContent = source.name;
                tab.onclick = () => {
                    currentSource = source.name;
                    updateSourceTabs();
                    renderNews();
                };
                container.appendChild(tab);
            });
        }

        function renderNews() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            let allItems = [];

            newsData.sources.forEach(source => {
                if (currentRegion !== 'all' && source.region !== currentRegion) return;
                if (currentSource !== 'all' && source.name !== currentSource) return;

                if (source.items) {
                    source.items.forEach(item => {
                        allItems.push({ ...item, sourceName: source.name, sourceRegion: source.region });
                    });
                }
            });

            // 按时间排序
            allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

            if (allItems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无新闻数据</p>
                    </div>
                `;
                return;
            }

            allItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';

                const timeStr = item.pubDate ? formatTime(item.pubDate) : '';

                card.innerHTML = `
                    <div class="news-header">
                        <span class="news-source">${item.sourceName}</span>
                        <span class="news-time">${timeStr}</span>
                    </div>
                    <h3 class="news-title">
                        <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                    </h3>
                    ${item.description ? `<p class="news-description">${item.description}</p>` : ''}
                    <div class="news-footer">
                        <a href="${item.link}" target="_blank" rel="noopener" class="read-more">
                            阅读全文 →
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function formatTime(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diff = now - date;

                if (diff < 3600000) {
                    return `${Math.floor(diff / 60000)}分钟前`;
                } else if (diff < 86400000) {
                    return `${Math.floor(diff / 3600000)}小时前`;
                } else {
                    return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                }
            } catch {
                return dateStr;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', loadNewsData);
    </script>
