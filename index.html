        * {

            padding: 0;

        }

        body {

            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
            padding: 32px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .update-time {
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .refresh-btn {
            padding: 10px 20px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Stats Section */
        .stats-section {
            padding: 24px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.15); }
        .stat-icon.pink { background: rgba(236, 72, 153, 0.15); }
        .stat-icon.cyan { background: rgba(6, 182, 212, 0.15); }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Tabs */
        .tabs-section {
            padding: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .region-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .region-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-tab.active {
            background: var(--gradient-primary);
            color: white;
        }

            background: rgba(255, 255, 255, 0.05);
        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;

            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;

        .source-tab.active {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .source-tab:hover:not(.active) {
            border-color: var(--text-muted);
        }

        /* News Grid */
        .news-section {
            padding: 24px 0 48px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .news-card:hover::before {
            opacity: 1;
        }

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;

        .news-title a:hover {
            color: var(--accent-blue);
        }

            color: var(--text-secondary);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

        }

            display: flex;
            justify-content: flex-end;
        }

            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .read-more:hover {
            background: var(--accent-blue);
            color: white;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;

        }

        }

        .loading-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Empty State */

        /* Responsive */
        @media (max-width: 768px) {

            }

                grid-template-columns: 1fr;
            }

                grid-template-columns: repeat(2, 1fr);
            }
        }

          "link": "https://36kr.com/p/3717920631830152?f=rss",
          "description": "凌晨三点的房子，孩子在睡梦中踢开了被子。卧室空调敏锐察觉室温下降，风向自动偏转。走廊地脚灯亮起微光，刚好够父母看清路面，又不至于惊醒孩子。半小时后，孩子翻身后重新盖好被子，全屋设备又悄然恢复如初。全程，没有人按下任何按钮。曾经只会默默待命的房子，正慢慢学会倾听。\n  &nbsp;\n  当不同品牌开始对话\n  智能家居讲了二十年故事，却始终困在一个尴尬的瓶颈：买A品牌的灯，配B品牌的开关，用C品牌的语音助手——它们各自聪明，却不愿对话。所谓的全屋智能，最终变成一堆智能孤岛：你需要记住三个App、四套逻辑、五组唤醒词。这份“智能”，到头来竟变成对记忆力的考验。\n  而Matter协议给出了一个直接答案：让不同品牌说同一种语言。空调不再是某个品牌的空调，窗帘不再是某个品牌的窗帘——它们只是“空调”和“窗帘”，在同一个家里默契配合。当你轻声说一句“我困了”，灯光便缓缓调暗，窗帘自动闭合，空调切换至睡眠模式。你不用特意喊“某某同学打开某某窗帘”，不需要记得任何品牌。你只需要表达需求，房子自会替你完成所有后续动作。这就是 Matter协议真正在做的事：把“人迁就设备”的被动，变成 “设备迁就人”的",
          "pubDate": "2026-03-11 10:27:26  +0800"

          "link": "https://36kr.com/p/3717914509702534?f=rss",
          "description": "冰箱轻轻嗡鸣了一声，像一声叹息。这是它在这个家里的第十个夏天。门封条早已微微变形，每天多耗半度电；制冷时好时坏，冷冻室的饺子总免不了黏在一起。主人早已习惯了这些，就像习惯一把坐旧的椅子——还能用，但再也谈不上好用。在上海的很多家庭里，这样的“老兵”还有很多。换掉它们，总觉得可惜；留着，又总在生活里添点小麻烦。\n  2026年的这个春天，一道政策让“换”字不再沉重。根据上海市2026年家电以旧换新、数码和智能产品购新补贴政策，个人消费者购买指定品类产品，可享受最终销售价格15%的补贴——家电单件最高补1500元，数码和智能产品单件最高补500元。\n  &nbsp;\n  从“换新”到“换一种生活”\n  其实以旧换新，它换的是一整个更舒服的生活。十年前的老电视，没有高清画质，没有智能语音，没有画质增强，看剧总少点沉浸感。换了量子点电视，才发现《繁花》里的光影层次竟如此丰富。五年前的旧空调，没有新风功能，没有语音控制。换了新一级能效的智能空调，才知道夏天可以这么安静。在AWE2026展台，观众可以亲身体验这种“焕新”的质感。手机、平板、智能手表、智能眼镜，都在补贴之列。\n  &nbsp;\n  ",

          "description": "作者｜黄楠\n  编辑｜袁斯来\n  中国人工智能产业正经历从技术突破向产业普适的跃迁。如何让实验室里的算法模型在真实生产环境中“跑起来”，成为各地抢占新一轮产业高地的核心命题。\n  在这一背景下，从单点技术引入转向系统生态构建，成为后发城市实现产业突围的关键路径。\n  3月10日，宜宾市2026长三角人工智能产业合作推介暨项目合作协议签署仪式在上海举行。这座曾以白酒、煤炭为标签的西部城市宜宾，面向人工智能产业规模占全国三分之一的长三角，一次性推出20亿场景清单、20亿产业基金及5年期最高1亿元经费榜单。\n  推介会上发布的20亿元人工智能应用场景机会清单，涵盖具身智能、AI垂类应用、数据基础设施三大领域，共19个具体场景。\n  其中，具身智能领域投资超10亿元，围绕服务、工业、城市治理、智能驾驶四大类超过120个子场景，涉及机器人1000余台；AI垂类应用领域投资超7亿元，聚焦消费、工业、汽车、治理领域共13个场景，包括白酒文化AR/VR体验、动力电池和光伏产业的AI质检、汽车制造全流程AI监测等；数据基础设施领域投资约3亿元，涉及智能算力服务采购、白酒行业可信数据空间建设等。\n  \n ",

        {
          "title": "全网疯抢的AI“小龙虾”到底割了多少打工人的韭菜？",
          "link": "http://www.huxiu.com/article/4840479.html?f=wangzhan",

        function updateUI() {
            if (!newsData) return;

            // 统计数据
            let totalNews = 0;
            let intSources = 0, cnSources = 0;
            let intNews = 0, cnNews = 0;
            
            newsData.sources.forEach(source => {
                const count = source.items ? source.items.length : 0;
                totalNews += count;
                if (source.region === 'chinese') { cnSources++; cnNews += count; }
                else { intSources++; intNews += count; }
            });

            document.getElementById('total-news').textContent = totalNews;
            document.getElementById('int-sources').textContent = intSources;
            document.getElementById('cn-sources').textContent = cnSources;
            document.getElementById('count-all').textContent = totalNews;
            document.getElementById('count-international').textContent = intNews;
            document.getElementById('count-chinese').textContent = cnNews;

            updateSourceTabs();
            renderNews();

            // 隐藏加载动画
            document.getElementById('loading').classList.add('hidden');

            allTab.onclick = () => {
                currentSource = 'all';
                updateSourceTabs();
                renderNews();
            };
            container.appendChild(allTab);

            sources.forEach(source => {
                const tab = document.createElement('button');
                tab.className = 'source-tab' + (currentSource === source.name ? ' active' : '');
                tab.textContent = source.name;
                tab.onclick = () => {
                    currentSource = source.name;
                    updateSourceTabs();
                    renderNews();
                };
                container.appendChild(tab);
            });
        }

        function renderNews() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            let allItems = [];

            newsData.sources.forEach(source => {
                if (currentRegion !== 'all' && source.region !== currentRegion) return;
                if (currentSource !== 'all' && source.name !== currentSource) return;

                if (source.items) {
                    source.items.forEach(item => {
                        allItems.push({ ...item, sourceName: source.name, sourceRegion: source.region });
                    });
                }
            });

            // 按时间排序
            allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

            if (allItems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无新闻数据</p>
                    </div>
                `;
                return;
            }

            allItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';

                const timeStr = item.pubDate ? formatTime(item.pubDate) : '';

                card.innerHTML = `
                    <div class="news-header">
                        <span class="news-source">${item.sourceName}</span>
                        <span class="news-time">${timeStr}</span>
                    </div>
                    <h3 class="news-title">
                        <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                    </h3>
                    ${item.description ? `<p class="news-description">${item.description}</p>` : ''}
                    <div class="news-footer">
                        <a href="${item.link}" target="_blank" rel="noopener" class="read-more">
                            阅读全文 →
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function formatTime(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diff = now - date;

                if (diff < 3600000) {
                    return `${Math.floor(diff / 60000)}分钟前`;
                } else if (diff < 86400000) {
                    return `${Math.floor(diff / 3600000)}小时前`;
                } else {
                    return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                }
            } catch {
                return dateStr;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', loadNewsData);
    </script>
</body>
</html>
